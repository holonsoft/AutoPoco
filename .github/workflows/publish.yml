name: Publish to NuGet

# Triggered by version tags such as v5.2.0 or v5.2.0-preview.1.
# Authenticates against nuget.org with trusted publishing (OIDC), no API key is stored anywhere.
# The nuget.org policy matches this file name (publish.yml) and the environment name (release).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # required for the OIDC token that NuGet/login exchanges
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer reads the version from git tags

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Build
        run: dotnet build holonsoft.AutoPoco.slnx -c Release

      - name: Test
        run: dotnet test holonsoft.AutoPoco.Tests/holonsoft.AutoPoco.Tests.csproj -c Release --no-build

      - name: Pack
        run: dotnet pack holonsoft.AutoPoco.slnx -c Release --no-build -o artifacts

      - name: Verify package version matches the tag
        run: |
          expected="${GITHUB_REF_NAME#v}"
          ls -l artifacts
          test -f "artifacts/holonsoft.AutoPoco.${expected}.nupkg"

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }} # nuget.org profile name, not the email

      - name: Push to nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
