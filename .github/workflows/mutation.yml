name: Mutation tests

# Stryker.NET checks whether the tests notice changes to the code. A full run of the core library takes
# about an hour, too long for every push, so it runs once a week and on demand. It only reports for now:
# the break threshold in stryker-config.json is 0 until there is a stable baseline.

on:
  schedule:
    - cron: '0 3 * * 1' # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        package: [Core, Faker]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      # The script sets MinVerSkip=true for the run, see the comment in eng/mutation-test.ps1.
      - name: Run Stryker.NET
        shell: pwsh
        run: |
          ./eng/mutation-test.ps1 -Package ${{ matrix.package }} | Tee-Object -FilePath stryker.log
          $exitCode = $LASTEXITCODE
          $score = Select-String -Path stryker.log -Pattern 'final mutation score is (.+)$' | Select-Object -Last 1
          $line = if ($score) { $score.Matches[0].Groups[1].Value } else { 'not reported' }
          "### Mutation score ${{ matrix.package }}: $line" >> $env:GITHUB_STEP_SUMMARY
          exit $exitCode

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-${{ matrix.package }}
          path: '*/StrykerOutput/*/reports/'
          if-no-files-found: warn
